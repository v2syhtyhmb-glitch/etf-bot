name: Jubail Briefing
on:
  schedule:
    - cron: '55 1 * * *'   # 사우디 오전 4:55
    - cron: '30 13 * * *'  # 사우디 오후 4:30 = 미국 서머타임 개장
    - cron: '30 14 * * *'  # 사우디 오후 5:30 = 미국 윈터타임 개장
  workflow_dispatch:
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python telegram_etf.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
